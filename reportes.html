<p>Las fechas filtran ventas y productos vendidos. El inventario muestra las existencias actuales.</p>

<section id="reporte">
<h2 id="reporte-titulo">Ventas</h2>
<p id="reporte-periodo"></p>
<div id="resultados">
</div>
</section>
<div class="no-imprimir">
<button id="imprimir">Imprimir reporte</button>
<button id="exportar">Exportar CSV para Excel</button>
</div>
