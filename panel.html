<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inicio | Copy Copy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/logincss.css" />
    <link rel="stylesheet" href="css/sistema.css" />
    <link rel="stylesheet" href="css/navegacion.css" />
    <link rel="stylesheet" href="css/animaciones.css" />
    <link rel="stylesheet" href="css/iconos.css" />
    <link rel="stylesheet" href="css/tema.css" />

    <!-- Los scripts esperan a que termine de cargar el HTML. -->
    <script src="js/components/navigation.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/datos.js" defer></script>
    <script src="js/pages/panel.js" defer></script>
    <script src="js/sistema.js" defer></script>
    <script src="js/estilos.js" defer></script>
    <script src="js/iconos.js" defer></script>
  </head>
  <body class="pagina-sistema" data-page="panel" hidden>
    <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
    <div data-navigation></div>
    <p id="mensaje" role="status" aria-live="polite" hidden></p>
    <main id="contenido" tabindex="-1">
      <section class="inicio-marca" aria-labelledby="inicio-titulo">
        <div class="logo-icono logo-icono--principal">
          <img
            src="assets/copy.jpeg"
            width="1254"
            height="1254"
            alt="Logo de Copy Copy: emblema geométrico naranja"
          />
        </div>
        <div class="inicio-marca__texto">
          <p class="inicio-marca__etiqueta">PAPELERÍA Y FOTOCOPIADO</p>
          <h1 id="inicio-titulo">Tu día en Copy Copy</h1>
          <p>Ventas, productos y reportes. Todo en un solo lugar.</p>
          <a class="boton" href="ventas.html" data-icon="plus"
            ><img
              class="icono"
              src="assets/icons/cart.svg"
              alt=""
              aria-hidden="true"
              width="20"
              height="20"
            />Nueva venta</a
          >
        </div>
      </section>
      <div id="resumen" class="resumen"></div>
      <section aria-labelledby="seccion-1">
        <h2 id="seccion-1">Últimas ventas</h2>
        <div id="ultimas"></div>
      </section>
      <section aria-labelledby="seccion-2">
        <h2 id="seccion-2">Productos por reponer</h2>
        <div id="stock-bajo"></div>
        <a href="inventario.html"
          ><img
            class="icono"
            src="assets/icons/box.svg"
            alt=""
            aria-hidden="true"
            width="20"
            height="20"
          />Abrir inventario</a
        >
      </section>
    </main>
    <footer>
      <p>
        Copy Copy · Datos guardados en este navegador · Acceso de demostración
      </p>
    </footer>
  </body>
</html>
